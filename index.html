  .login-card { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 26px; padding: 28px 20px; box-shadow: 0 12px 30px rgba(15,23,42,0.06); text-align: center; }
  .brand-badge { width: 52px; height: 52px; border-radius: 16px; background: var(--primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; margin-bottom: 12px; }

  .login-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

  .pin-dot { width: 48px; height: 48px; border-radius: 14px; border: 2px solid var(--border); background: #f8fafc; display: flex; align-items: center; justify-content: center; }

  .pin-dot.filled::after { content: ''; width: 11px; height: 11px; border-radius: 50%; background: #fff; }
  .pin-dot.err { border-color: var(--rose); background: var(--rose-bg); }
  .err-text { color: var(--rose); font-size: 12px; font-weight: 600; min-height: 18px; margin-bottom: 8px; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 260px; margin: 0 auto; }
  .key-btn { height: 54px; border-radius: 14px; background: #f8fafc; border: 1px solid var(--border); font-size: 19px; font-weight: 700; color: var(--text); }
  .key-btn:active { background: var(--primary); color: #fff; }
  .key-btn.ghost { background: transparent; border-color: transparent; font-size: 12px; color: var(--muted); }
  .demo-box { margin-top: 20px; padding-top: 14px; border-top: 1px solid #f1f5f9; text-align: left; }
  .demo-label { font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; }
  .demo-grid { display: flex; flex-direction: column; gap: 6px; }
  .demo-btn { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
  .demo-btn strong { font-size: 12px; color: var(--text); }
  .demo-btn span { font-size: 11px; color: var(--muted); }

  /* Topbar */

  .text-right { text-align: right; }
  .text-center { text-align: center; }

  .prod-foot { margin-top: 10px; padding-top: 10px; border-top: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between; }
